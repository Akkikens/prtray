name: PRTray
options:
  bundleIdPrefix: com.akkikens
  deploymentTarget:
    macOS: "14.0"
targets:
  PRTray:
    type: application
    platform: macOS
    sources: [PRTray]
    info:
      path: PRTray/Info.plist
      properties:
        CFBundleDisplayName: PRTray
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright (c) 2026 Akshay Kalapgar. MIT License."
        # Client ID of the GitHub OAuth App (device flow enabled). Not a secret.
        GitHubClientID: Ov23liWAoBwOVoyIZdQ7
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akkikens.prtray
        PRODUCT_NAME: PRTray
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
